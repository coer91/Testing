<header class="coer-page-title" title=''>
    @if((title() && title()!.length > 0) || information().show) {
        <h2>
            <span> {{ title() }} </span>
    
            <!-- Button Information -->
            @if(information().show) {
                <wia-button
                    type="icon-rounded"
                    icon="iw-info-circle font-size-17px" 
                    minWidth="17px"
                    maxWidth="17px"
                    minHeight="17px"
                    maxHeight="17px"
                    (onClick)="onClickInformation.emit()"
                ></wia-button>
            }
        </h2>
    }

    <!-- Navigation -->
    @if(showBreadcrumbs()) {
        <nav>    
            <!-- Breadcrumbs -->
            <div class="breadcrumbs">  
                <a class="padding-left-5px padding-rigth-5px" draggable="false">
                    @if(_labelRoot()) {
                        {{ _labelRoot() }}
                    }

                    @else {
                        <i [class]="_iconRoot()"></i>
                    }
                </a>

                @for(breadcrumb of _breadcrumbs(); track breadcrumb.__index__) {
                    <span class="slash">/</span>
                    <a [routerLink]='(breadcrumb.path && breadcrumb.path.length > 0 && !_isLoading()) ? breadcrumb.path : null'
                       [queryParams]='breadcrumb.queryParams' 
                       (click)="(breadcrumb.click && !_isLoading()) ? breadcrumb.click() : null"
                       draggable="false">
                       {{ breadcrumb.page }}
                   </a>
                }    
            </div> 

            <!-- Go Back -->
            @if(goBack().show) {
                <a  class="go-back"
                    [routerLink]="!_isLoading() ? goBack().path : null"
                    [queryParams]='goBack().queryParams'
                    (click)="_ClickGoBack()"
                    draggable="false">
                    <i class="iw-reply font-size-20px"></i>
                </a> 
            }
        </nav>
    }
</header>
