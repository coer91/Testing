@if(user()) {
    <section class="flex-wrap margin-top-10px">
        <!-- Partner -->
        @if(_hasId()) {
            <div class="flex-basis-100 md-flex-basis-45 xl-flex-basis-20 flex-grow-1 margin-bottom-5px">
                <wia-selectbox
                    label="Partner"
                    [(ngModel)]="partner"
                    [dataSource]="partnerList()"
                    [isLoading]="_isLoading()"
                    [isReadonly]="!canUpdate()"
                ></wia-selectbox>
            </div>
        }

        <!-- Email -->
        <div class="flex-basis-100 md-flex-basis-45 xl-flex-basis-20 flex-grow-1 margin-bottom-5px">
            <wia-textbox
                label="Email"
                [ngModel]="user()!.Email"
                [isReadonly]="true"
                [isLoading]="_isLoading()"
            ></wia-textbox>
        </div> 
    
        <!-- Factory -->
        <div class="flex-basis-100 md-flex-basis-45 xl-flex-basis-20 flex-grow-1 margin-bottom-5px">
            <wia-textbox
                label="Factory"
                [ngModel]="user()!.Factory"
                [isReadonly]="true"
                [isLoading]="_isLoading()"
            ></wia-textbox>
        </div>
    
        <!-- Department -->
        <div class="flex-basis-100 md-flex-basis-45 xl-flex-basis-20 flex-grow-1 margin-bottom-5px">
            <wia-textbox
                label="Department"
                [ngModel]="user()!.Department"
                [isReadonly]="true"
                [isLoading]="_isLoading()"
            ></wia-textbox>
        </div>
    </section>
}
