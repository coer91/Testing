<wia-page-title
    title="Users"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title>  

@if(IsNotNull(user())) {
    <section #container class="container-section flex-wrap">
        <!--  -->
        <div class="flex-basis-350px">
            <wia-textbox
                label="Name"
                [(ngModel)]="user()!.FullName"
                [isReadonly]="true"
            ></wia-textbox>
        </div>
    
        <!-- Is Active -->
        <div class="flex-basis-auto"> 
            <wia-switch 
                [label]="user()!.IsActive ? 'Active' : 'Disabled'"
                [(ngModel)]="user()!.IsActive"
                [textColor]="true"
                [isLoading]="isLoading()" 
                [isReadonly]="true"
            ></wia-switch>  
        </div> 

        <!-- Actions -->
        @if(canUpdate()) {
            <div class="flex-basis-auto margin-left-auto"> 
                <wia-button 
                    [icon]="iconButton()" 
                    type="icon-filled-rounded"
                    [color]="colorButton()"
                    [isLoading]="isLoading()"   
                    [isInvisible]="!showButton()"
                    (onClick)="Action()"
                ></wia-button> 
            </div> 
        }
    </section> 

    <wia-tab #tabRef [(ngModel)]="tab" 
        height="full" (onClickTab)="SetPageFilters({ tab: $event })" [siblings]="[container]">
        <ng-template templateRef="Information">
            <users-form-information
                #informationRef
                [user]="user()!"
                [isLoadingExternal]="isLoading()"
                [partnerList]="partnerList()"
                (onLoading)="isLoading.set($event)"
                (onUpdated)="GetUser()"
            ></users-form-information>
        </ng-template>


        <!-- Roles -->
        <ng-template templateRef="Roles" [show]="(user()?.Id || 0) > 0">
            <users-form-addRoles 
                #addRolesRef 
                [user]="user()!"
                [canUpdate]="canUpdate()"
                [isLoadingExternal]="isLoading()"
                [siblings]="[tabRef.compensationHeight()]"
                (onRoleAdded)="GetUser()"
                (onRoleDeleted)="GetUser()"
            ></users-form-addRoles>
        </ng-template>
    </wia-tab>  
}
