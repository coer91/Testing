<wia-page-title
    title="Users"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title>  

<wia-grid
    [(ngModel)]="userList"
    height="full"
    [isLoading]="isLoading()"
    [columns]="[  
        { property: 'User', textAlignX: 'center', width: '125px' },
        { property: 'FullName' }, 
        { property: 'IsActive', alias: 'Status', textAlignX: 'center', width: '100px', template: isActiveTemplate } 
    ]"
    [headerSettings]="{
        search: { show: true }
    }"
    [bodySettings]="{
        navigateButton: { show: true, path: item => `${path}/${item.row.User}` }
    }"    
    (onDoubleClickRow)="router.navigateByUrl(`${path}/${$event.User}`)">

    <wia-switch
        #IsActive
        [label]="onlyActive() ? 'Only Active' : 'All'"
        [(ngModel)]="onlyActive"
        [textColor]="true" 
        [isLoading]="isLoading()"       
        (onValueChange)="GetUserList()"
    ></wia-switch>  

</wia-grid>
