<wia-grid
    [(ngModel)]="rolePageList"
    [columns]="[ 
        { property: 'Role' }, 
        { property: 'CanCreate', alias: 'Create', width: '75px', inputSwitch: switchTemplate },
        { property: 'CanUpdate', alias: 'Update', width: '75px', inputSwitch: switchTemplate },
        { property: 'CanDelete', alias: 'Delete', width: '75px', inputSwitch: switchTemplate }   
    ]" 
    [headerSettings]="{
        search:    { show: false },
        addButton: { show: !isLoading(), preventDefault: true }
    }"
    [bodySettings]="{
        deleteButton: { show: canUpdate(), preventDefault: true },
        showRowNumber: true
    }"
    [isLoading]="isLoading()"
    [siblings]="siblings()"
    height="full"
    (onInputChange)="PatchPermission($event)"
    (onClickDeleteRow)="DeleteRole($event)"
    (onClickAdd)="modalRef.Open()">
    
    <h3>Roles with access</h3>
</wia-grid>


<wia-modal #modalRef [showCancelButton]="false" (onClose)="gridRef.UncheckBy(x => true)">   
    <wia-grid
        #gridRef
        [(ngModel)]="roleListAvailable"  
        [isLoading]="isLoading()"
        [columns]="[
            { property: 'Name', alias: 'Role', width: '180px' },
            { property: 'About' }  
        ]"
        [headerSettings]="{
            search: { show: true }
        }"
        [bodySettings]="{
            selectionRows: { show: true, selectOverRow: true }, 
        }"
        [footerSettings]="{ show: false }"
        [useContainer]="false"
        marginTop="10px"
        marginLeft="0px"
        marginRight="0px" 
        height="500px"
        maxHeight="500px"
        width="510px">  
        <ng-content></ng-content> 
    </wia-grid>   

    <ng-template templateRef="modal-footer">
        <wia-button
            label="Cancel"
            icon="cancel"
            color="danger" 
            [isInvisible]="isLoading()"
            (onClick)="modalRef.Close()"
        ></wia-button>

        <wia-button
            label="Save"
            icon="save"
            color="success"
            [isReadonly]="gridRef.selectedValue().length <= 0"
            [isLoading]="isLoading()"
            (onClick)="SaveRolePage()"
        ></wia-button>
    </ng-template>
</wia-modal>
