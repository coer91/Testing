<wia-page-title
    title="Trolly Configuration"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title> 

<section #containerSection class="container-section flex-wrap">
    <div class="flex-basis-100 flex-grow-1"> 
        @if(!useScanner) {
            <wia-textbox 
                placeholder='Manual Scanner' 
                [(ngModel)]="manualScanner"   
                [maxLength]="500"
                marginBottom="10px" 
                (onKeyupEnter)="OnScanCodeDevelopment()"
            ></wia-textbox> 
        }

        <wia-textbox  
            label='Transaction' 
            [(ngModel)]="transaction" 
            [isLoading]="isLoading()" 
            [isReadonly]="true"  
            [maxLength]="250"
            [externalButtons]="{
                showLeft:   showSaveButton(),
                iconLeft:   'save', 
                colorLeft:  'success',
                showRight:  IsNotOnlyWhiteSpace(transaction()),
                iconRight:  'cancel', 
                colorRight: 'danger'
            }"
            (onClickLeft)="Save()"
            (onClickRight)="Cancel(true)"
        ></wia-textbox> 
    </div> 
</section> 


<wia-grid
    height="full"
    [value]="dataSource()"
    [siblings]="[containerSection]"
    [isLoading]="isLoading()"
    [bodySettings]="{ modalButton: { show: true, position: 'left' }}"
    [footerSettings]="{ show: false }"
    [columns]="[ 
        { property: 'PartNumber', alias: 'Product', background: backgroundQTY, color: colorQTY },
        { property: 'Qty'       , alias: 'Qty'    , background: backgroundQTY, color: colorQTY, format: 'number' },
        { property: 'QtyChecked', alias: 'Scanned', background: backgroundQTY, color: colorQTY, format: 'number' },
    ]"
    (onClickModalRow)="detail.set($event); modal.Open();">
    <div [innerHTML]="counter() | html" class="width-100"></div>  
</wia-grid>


<!-- Detail -->
<wia-modal #modal [title]="detail()?.PartNumber" icon="bi bi-box-seam-fill" (onClose)="detail.set(null);">
    @if(IsNotNull(detail())) {
        <wia-grid
            [value]="(detail()!.Detail)" 
            [isLoading]="isLoading()" 
            [useContainer]="false"
            marginTop="5px"
            marginLeft="0px"
            marginRight="0px"
            marginBottom="10px"
            width="300px"
            height="auto"
            [bodySettings]="{ 
                deleteButton: { show: true, displayProperty: 'LotNumber', preventDefault: true, position: 'left' } 
            }"
            [footerSettings]="{ show: false }"
            [columns]="[ 
                { property: 'LotNumber'  , alias: 'Lot'    , background: backgroundQTY, color: colorQTY }, 
                { property: 'Qty'        , alias: 'Qty'    , background: backgroundQTY, color: colorQTY, width: '50px', format: 'number' }, 
                { property: 'EoNumber'   , alias: 'EO'     , background: backgroundQTY, color: colorQTY },
            ]"
            (onClickDeleteRow)="RemoveLot($event)">  

            <h4 class="color-gray width-100 flex-middle-between"> 
                <span>Qty: {{`${detail()?.QtyChecked} / ${detail()?.Qty}`}}</span> 

                @if(((detail()?.Qty || 0) > 0) && (detail()?.QtyChecked == detail()?.Qty)) {
                    <i class="iw-check-circle-fill color-success font-size-20px"></i>
                }
            </h4>
        </wia-grid> 
    }
</wia-modal>
