<wia-page-title
    title="Trolly Configuration"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title> 

@if((view().equals('split'))) {
    <lot-split
        #lotSplitRef 
        [translatory]="translatory"
        [useContainer]="true"
        [showGoBackButton]="true" 
        (onBack)="view.set('trolly')"
    ></lot-split>
}

@else if((view().equals('join'))) {    
    <lot-join
        #lotJoinRef 
        [translatory]="translatory"
        [useContainer]="true"
        [showGoBackButton]="true"
        (onBack)="view.set('trolly')"
    ></lot-join>
} 

@else {
    <section #containerSection class="container-section flex-wrap">
        <div class="flex-basis-100 flex-grow-1"> 
            @if(!useScanner) {
                <wia-textbox 
                    [placeholder]='translatory.label.ManualScanner()'
                    [(ngModel)]="manualScanner"   
                    [maxLength]="500"
                    marginBottom="10px" 
                    (onKeyupEnter)="OnScanCodeDevelopment()"
                ></wia-textbox> 
            }
    
            <wia-textbox  
                [label]='translatory.label.Transaction()' 
                [(ngModel)]="transaction" 
                [isLoading]="isLoading()" 
                [isReadonly]="true"  
                [maxLength]="250"
                [externalButtons]="{
                    showLeft:   IsNotOnlyWhiteSpace(transaction()),
                    iconLeft:   'cancel', 
                    colorLeft:  'danger',
                    showRight:  showSaveButton(),
                    iconRight:  'save', 
                    colorRight: 'success' 
                }" 
                (onClickLeft)="Cancel(true)"
                (onClickRight)="Save()"
            ></wia-textbox>         
        </div> 
    
        <div class="flex-basis-100 flex-grow-1 flex-middle-center gap-10px">
            <wia-button
                label="Split"
                icon="bi bi-arrows-expand-vertical margin-right-10px font-size-20px"
                width="50%"
                (onClick)="view.set('split')"
            ></wia-button>
    
            <wia-button
                label="Join"
                icon="bi bi-arrows-collapse-vertical margin-right-10px font-size-20px"
                width="50%"
                (onClick)="view.set('join')"
            ></wia-button>
        </div>
    </section>  
    
    <wia-grid
        height="full"
        [value]="dataSource()"
        [siblings]="[containerSection]"
        [isLoading]="isLoading()"
        [bodySettings]="{ modalButton: { show: true, position: 'left' }}"
        [footerSettings]="{ show: false }"
        [columns]="[ 
            { property: 'PartNumber' , alias: translatory.label.Material(), background: backgroundQTY, color: colorQTY },
            { property: 'Qty'        , alias: translatory.label.Quantity(), background: backgroundQTY, color: colorQTY, format: 'number' },
            { property: 'QtyChecked' , alias: 'Scanned'                   , background: backgroundQTY, color: colorQTY, format: 'number' },
        ]"
        (onClickModalRow)="detail.set($event); modal.Open();">
        <div [innerHTML]="counter() | html" class="width-100"></div>  
    </wia-grid>
    
    
    <!-- Detail -->
    <wia-modal #modal [title]="detail()?.PartNumber" icon="bi bi-box-seam-fill" (onClose)="detail.set(null);">
        @if(IsNotNull(detail())) {
            <wia-grid
                [value]="(detail()!.Detail)" 
                [isLoading]="isLoading()" 
                [useContainer]="false"
                marginTop="5px"
                marginLeft="0px"
                marginRight="0px"
                marginBottom="10px"
                width="300px"
                height="auto"
                [columns]="[ 
                    { property: 'LotNumber', alias: translatory.label.Lot()     , background: backgroundQTY, color: colorQTY }, 
                    { property: 'Qty'      , alias: 'Qty', background: backgroundQTY, color: colorQTY, width: '50px', format: 'number' }, 
                    { property: 'EoNumber' , alias: 'EO'                        , background: backgroundQTY, color: colorQTY },
                ]"
                [bodySettings]="{ 
                    deleteButton: { show: true, displayProperty: 'LotNumber', preventDefault: true, position: 'left' } 
                }"
                [footerSettings]="{ show: false }"
                (onClickDeleteRow)="RemoveLot($event)">  
                <div [innerHTML]="counterDetail() | html" class="width-100 white-space-normal"></div> 
            </wia-grid> 
        }
    </wia-modal> 
}
