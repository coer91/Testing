<wia-page-title
    title="GKD Stock In"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title> 
 
<section #containerSection class="container-section">
    @if(!useScanner) {
        <wia-textbox 
            placeholder='Manual Scanner' 
            [(ngModel)]="manualScanner"   
            [maxLength]="250"
            marginBottom="10px" 
            (onKeyupEnter)="OnScanCodeDevelopment()"
        ></wia-textbox> 
    }

    <wia-textbox 
        label='Transaction' 
        [(ngModel)]="transaction" 
        [isLoading]="isLoading()" 
        [isReadonly]="true"  
        [maxLength]="250"
        [externalButtons]="{
            showLeft:   showSaveButton(),
            iconLeft:   'save', 
            colorLeft:  'success',
            showRight:  IsNotOnlyWhiteSpace(transaction()),
            iconRight:  'cancel', 
            colorRight: 'danger'
        }"
        (onClickLeft)="Save()"
        (onClickRight)="Cancel(true)" 
    ></wia-textbox> 
</section>

<wia-grid
    height="full"
    [(ngModel)]="dataSource"
    [siblings]="[containerSection]"
    [isLoading]="isLoading()"  
    [bodySettings]="{ showBorders: true }" 
    [columns]="[ 
        { property: 'LotNumber' , alias: 'Lot'    , background: backgroundSTATUS, color: colorSTATUS },
        { property: 'PartNumber', alias: 'Product', background: backgroundSTATUS, color: colorSTATUS },
        { property: 'Qty'       , alias: 'Qty'    , background: backgroundSTATUS, color: colorSTATUS },
        { property: 'EoNumber'  , alias: 'EO'     , background: backgroundSTATUS, color: colorSTATUS }, 
    ]">
    
    @if(IsNotOnlyWhiteSpace(transaction())) {
        <h4 class="color-gray"> 
            <i class="iw-barcode font-size-20px"></i>
            {{ indicator() }} 
        </h4>
    }
</wia-grid>
