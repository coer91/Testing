<!-- Title -->
<wia-page-title
    [title]="title()"
    [breadcrumbs]="breadcrumbs()"
></wia-page-title> 

<nav>
    @for(item of _pages(); track item.Id) {           
        <a [routerLink]="_getPath(item)" class="animation-fadeIn">
            @if((item?.Icon || '').length > 0) {
                <i [class]="item!.Icon"></i>
            }
            <span> {{ item.Label }} </span>
        </a> 
    }
</nav>
