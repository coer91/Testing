    <wia-grid
        [(ngModel)]="dataSource"
        [isLoading]="true"
        [isReadonly]="false"
        [isInvisible]="false"
        [isHidden]="false"
        [useContainer]="true"
        label="Componentes triple Action"
        icon="iw-home-door-fill"
        height="full"
        marginLeft="30px" 
        [isDraggable]="true"
        [columns]="[
            { property: 'id'  , width: '100px', background: 'success', color: 'light'     },
            { property: 'option', background: 'success', color: 'light'   },  
            { property: 'name', show: showColumn(), background: 'success', color: 'light' },
        ]"  
        [bodySettings]="{            
            showStriped: true, 
            showBorders: true,
            modalButton: { show: true, background: 'success' }
        }"  
        (onClickFilter)="modalFilters.Open()"
    >
 
        
    </wia-grid>

    <wia-modal
    #modalFilters
    title="Filters"
    icon="iw-filter-fill"
    width="300px"
>
    <wia-selectbox
        label="Module"
         
        [isLoading]="isLoading()"
        marginTop="15px"
        marginBottom="15px" 
    ></wia-selectbox>

    <wia-selectbox
        label="Submodule" 
        [isLoading]="isLoading()"
        marginBottom="15px"
    ></wia-selectbox>

    <wia-switch   
        [isLoading]="isLoading()"
        [textColor]="true" 
    ></wia-switch>
</wia-modal>
