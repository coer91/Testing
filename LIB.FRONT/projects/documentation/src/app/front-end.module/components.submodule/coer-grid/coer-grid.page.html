<wia-page-title
    title="Grid"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title> 

    


<wia-grid
    #grid
    height="full" 
    [(ngModel)]="dataSourceSELECTION"
    [columns]="[
            { property: 'id'  , width: '100px', inputNumberbox  }, 
            { property: 'name', inputTextbox },
        ]"
    [bodySettings]="{
        deleteButton: { show: true, showConfirmation: false },
         editButton: { show: true, position: 'left'  },
          modalButton: { show: true, position: 'left' }
    }"
    (onKeyupEnter)="Test()"
></wia-grid>
