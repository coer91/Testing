   <wia-grid
    height="full"
    [headerSettings]="{
        buttonType: 'filled',
        saveButton: { show: true },
        cancelButton: { show: true },
    }"
></wia-grid>
 
    <wia-modal
    #modalFilters
    title="Filters"
    icon="iw-filter-fill"
    width="300px"
>
    <wia-selectbox
        label="Module"
         
        [isLoading]="isLoading()"
        marginTop="15px"
        marginBottom="15px" 
    ></wia-selectbox>

    <wia-selectbox
        label="Submodule" 
        [isLoading]="isLoading()"
        marginBottom="15px"
    ></wia-selectbox>

    <wia-switch   
        [isLoading]="isLoading()"
        [textColor]="true" 
    ></wia-switch>
</wia-modal>
