<wia-page-title
    title="Modal"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title>

<section class="container-section">
    <wia-button 
        label="Open"
        (onClick)="modal.Open()"
    ></wia-button>
</section>


<wia-modal #modal title="Modal" icon="iw-logo-coer91"> 
    <ng-template templateRef="modal-body">
        
    </ng-template>

    <ng-template templateRef="modal-footer">
        <wia-button
            label="Cancel"
            color="danger"
            (onClick)="modal.Close()"
        ></wia-button>
    </ng-template>
</wia-modal>
