        #PRINT
        formControlName="Print"
        position="horizontal"

            { Label: '2P', Value: 2 },
            { Label: '4P', Value: 4 },
            { Label: '8P', Value: 8 },
        ]"
        (onValueChange)="Log($event)"
    ></wia-radio>
 </wia-form>
