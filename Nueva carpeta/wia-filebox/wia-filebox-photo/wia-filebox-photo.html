<figure [id]="id() + 'figure-image'"
    [ngClass]="{ 
        'figure-photo': true,
        'border-dashed-4px': !_hasPhoto(), 
        'cursor-pointer': !_hasPhoto()
    }
    "[ngStyle]="{  
        'width' : _width(), 
        'height': _width() 
    }"
    (click)="!_hasPhoto() ? inputFile.click() : null"
>
    <img [src]="_photoBase64()" draggable="false" />
    
    @if(_showButtonContainer()) {
        <div class="button-container animation-fadeIn animation-duration-1"></div>
        
        @if(_showDelteButton()) {
            <button 
                type="button" 
                class="iw-mark" 
                (click)="DeletePhoto($event)"
            ></button>
        }
    }
</figure>  

<input 
    #inputFile
    type="file"
    [accept]="_extensions"
    (change)="SelectedFile(inputFile)"
>
