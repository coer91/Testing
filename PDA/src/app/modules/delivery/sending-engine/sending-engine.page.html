<wia-page-title
    [title]="pageTitle()"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title>  

<section #containerSection class="container-section">
    @if(!useScanner) {
        <wia-textbox
            placeholder='Manual Scanner'
            [(ngModel)]="manualScanner"
            [maxLength]="250"
            marginBottom="15px"
            (onKeyupEnter)="OnScanCodeDevelopment()"
        ></wia-textbox>
    }

    <wia-selectbox
            #deliveryNumberRef
            label="Order Number"
            [(ngModel)]="orderNumber"
            [dataSource]="orderNumberList()" 
            displayProperty="ORDER_NUMBER"
            [isReadonly]="orderNumberList().length <= 1"
            [isLoading]="isLoading()" 
            [externalButtons]="{
                showLeft:   showSaveButton(),
                iconLeft:   'cancel', 
                colorLeft:  'danger',
                showRight:  showSaveButton(),
                iconRight:  'save', 
                colorRight: 'success'
            }"
            (onClickLeft)="Cancel(true)"
            (onClickRight)="Save()" 
        ></wia-selectbox>
</section>


<wia-grid
    height="full"
    [(ngModel)]="dataSource"
    [siblings]="[containerSection]"
    [isLoading]="isLoading()" 
    [bodySettings]="{ 
        showBorders: true, 
        showRowNumber: true,  
        deleteButton: { show: true, preventDefault: true } 
    }" 
    [footerSettings]="{ show: false }"  
    [columns]="[           
        { property: 'SERIAL_NUMBER', alias: 'Engine', template },
        { property: 'MIP_CODE'     , alias: 'MIP'   , width: '80px' }
    ]"
    (onClickDeleteRow)="Remove($event)"> 
    <div [innerHTML]="counter() | html" class="width-100 white-space-normal"></div>
</wia-grid>
