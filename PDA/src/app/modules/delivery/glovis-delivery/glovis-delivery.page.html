<wia-page-title
    [title]="pageTitle()"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title> 

<section #containerSection class="container-section flex-wrap">
    <div class="flex-basis-100 flex-grow-1"> 
        @if(!useScanner) {
            <wia-textbox 
                placeholder='Manual Scanner' 
                [(ngModel)]="manualScanner"   
                [maxLength]="100"
                marginBottom="15px" 
                (onKeyupEnter)="OnScanCodeDevelopment()"
            ></wia-textbox> 
        } 

        <div [ngClass]="{ 'display-none': false }">
            <wia-selectbox
                #deliveryNumberRef
                label="Delivery Number"
                [(ngModel)]="delivery"
                [dataSource]="deliveryList()" 
                displayProperty="DELIVERY_NUMBER"
                [isReadonly]="deliveryList().length <= 1"
                [isLoading]="isLoading()" 
                [externalButtons]="{
                    showLeft:   showSaveButton(),
                    iconLeft:   'cancel', 
                    colorLeft:  'danger',
                    showRight:  showSaveButton(),
                    iconRight:  'save', 
                    colorRight: 'success'
                }"
                (onClickLeft)="Cancel(true)"
                (onClickRight)="Save()" 
            ></wia-selectbox>
        </div> 
    </div> 
</section>  

<wia-grid
    height="full"
    [value]="dataSource()"
    [siblings]="[containerSection]"
    [isLoading]="isLoading()" 
    [bodySettings]="{
        showBorders: true,   
        modalButton: { show: true, position: 'left' }
    }"
    [footerSettings]="{ show: false }"
    [columns]="[ 
        { property: 'PART_NUMBER', alias: translatory.label.Material(), background: backgroundQTY, color: colorQTY },
        { property: 'DETAIL'     , alias: 'Lots', template: lotsTemplate },
        { property: 'QTY'        , alias: translatory.label.Qty(),  background: backgroundQTY, color: colorQTY, format: 'number' },
    ]"
    (onClickModalRow)="detail.set($event); modal.Open();">
    <div [innerHTML]="counter() | html" class="width-100 white-space-normal"></div>  
</wia-grid>  


<!-- Detail -->
<wia-modal #modal [title]="detail()?.PART_NUMBER" icon="bi bi-box-seam-fill" (onClose)="detail.set(null);">
    @if(IsNotNull(detail())) {
        <wia-grid
            [value]="(detail()!.DETAIL)" 
            [isLoading]="isLoading()" 
            [useContainer]="false"
            marginTop="5px"
            marginLeft="0px"
            marginRight="0px"
            marginBottom="10px"
            width="300px"
            height="auto"
            [columns]="[ 
                { property: 'LOT_NUMBER', alias: translatory.label.Lot(), background: backgroundQTY, color: colorQTY }, 
                { property: 'QTY'       , alias: translatory.label.Qty(), background: backgroundQTY, color: colorQTY }, 
                { property: 'EO_NUMBER' , alias: 'EO'                   , background: backgroundQTY, color: colorQTY },
            ]"
            [bodySettings]="{ 
                deleteButton: { show: true, displayProperty: 'LOT_NUMBER', preventDefault: true, position: 'left' } 
            }"
            [footerSettings]="{ show: false }"
            (onClickDeleteRow)="RemoveLot($event)">  
            <div [innerHTML]="counterDetail() | html" class="width-100 white-space-normal"></div> 
        </wia-grid> 
    }
</wia-modal>
