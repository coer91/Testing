<wia-page-title
    [title]="pageTitle()"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title>  

<section #containerSection class="container-section flex-wrap">
    <div class="flex-basis-100 flex-grow-1">       
        @if(!useScanner) {
            <wia-textbox 
                [placeholder]='translatory.label.ManualScanner()' 
                [(ngModel)]="manualScanner"   
                [maxLength]="250"
                marginBottom="10px"  
                (onKeyupEnter)="OnScanCodeDevelopment()"
            ></wia-textbox> 
        } 
         
        <wia-textbox 
            label='Operation' 
            [(ngModel)]="transaction"   
            [maxLength]="250" 
            [isLoading]="isLoading()" 
            [isReadonly]="true" 
            [externalButtons]="{
                showLeft:  IsNotOnlyWhiteSpace(transaction()),
                iconLeft:  'cancel', 
                colorLeft: 'danger',  
            }" 
            (onClickLeft)="Cancel()"   
        ></wia-textbox>   
    </div> 
</section>   


<wia-grid
    height="full"
    [(ngModel)]="dataSource"
    [siblings]="[containerSection]"
    [isLoading]="isLoading()"    
    [bodySettings]="{ 
        showBorders: true, 
        showRowNumber: true,  
        deleteButton: { show: true, preventDefault: true } 
    }"
    [footerSettings]="{ show: false }"  
    [columns]="[ 
        { property: 'LOT_NUMBER' , alias: translatory.label.Lot()      },
        { property: 'PART_NUMBER', alias: translatory.label.Material() },
        { property: 'QTY'        , alias: translatory.label.Qty()      },
        { property: 'EO_NUMBER'  , alias: 'EO'                         }, 
    ]"
    (onClickDeleteRow)="Remove($event)"> 
    <div [innerHTML]="counter() | html" class="width-100 white-space-normal"></div>
</wia-grid>
