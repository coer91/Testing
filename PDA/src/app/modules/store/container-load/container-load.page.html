<wia-page-title
    [title]="pageTitle()"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title> 

<section #containerSection class="container-section flex-wrap">
    <div class="flex-basis-100 flex-grow-1"> 
        @if(!useScanner) {
            <wia-textbox 
                placeholder='Manual Scanner' 
                [(ngModel)]="manualScanner"   
                [maxLength]="250"
                marginBottom="10px" 
                (onKeyupEnter)="OnScanCodeDevelopment()"
            ></wia-textbox> 
        }

        <wia-textbox  
            label='Order Number' 
            [(ngModel)]="transaction" 
            [isLoading]="isLoading()" 
            [isReadonly]="true"  
            [maxLength]="250"
            [externalButtons]="{
                showLeft:   showSaveButton(),
                iconLeft:   'save', 
                colorLeft:  'success',
                showRight:  IsNotOnlyWhiteSpace(transaction()),
                iconRight:  'cancel', 
                colorRight: 'danger'
            }"
            (onClickLeft)="Save()"
            (onClickRight)="Cancel(true)"
        ></wia-textbox> 
    </div> 
</section>  

<wia-grid
    height="full"
    [(ngModel)]="dataSource"
    [siblings]="[containerSection]"
    [isLoading]="isLoading()"    
    [bodySettings]="{ showBorders: true, showRowNumber: true  }"  
    [footerSettings]="{ show: false }"
    [columns]="[ 
        { property: 'CASE_LABEL_ID', alias: translatory.label.Lot() },
        { property: 'TYPE'         , alias: 'Action', background: backgroundSTATUS, color: colorSTATUS },        
    ]">
    <div [innerHTML]="counter() | html" class="width-100 white-space-normal"></div>
</wia-grid>
