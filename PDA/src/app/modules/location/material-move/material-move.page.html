<wia-page-title
    [title]="`Transferencia de Material${useFIFO() ? ' FIFO' : ''}`"
    [breadcrumbs]="breadcrumbs()"
    [goBack]="goBack"
></wia-page-title> 
 
<section #containerSection class="container-section flex-wrap">
    <div class="flex-basis-100 flex-grow-1"> 
        @if(!useScanner) {
            <wia-textbox 
                [placeholder]='translatory.label.ManualScanner()' 
                [(ngModel)]="manualScanner"   
                [maxLength]="250"
                marginBottom="10px"  
                (onKeyupEnter)="OnScanCodeDevelopment()"
            ></wia-textbox> 
        }

        <wia-textbox  
            [label]='translatory.label.Transaction()' 
            [(ngModel)]="transaction" 
            [isLoading]="isLoading()" 
            [isReadonly]="true"  
            [maxLength]="250"
            [externalButtons]="{
                showLeft:   IsNotOnlyWhiteSpace(transaction()),
                iconLeft:   'cancel', 
                colorLeft:  'danger',
                showRight:  showSaveButton(),
                iconRight:  'save', 
                colorRight: 'success' 
            }" 
            (onClickLeft)="Cancel(true)"
            (onClickRight)="Save()"
        ></wia-textbox> 
    </div> 
</section>  


<!-- Grid -->
<wia-grid
    height="full"
    [value]="dataSource()"
    [siblings]="[containerSection]"
    [isLoading]="isLoading()" 
    [bodySettings]="{
        showBorders: true, 
        showRowNumber: true, 
        modalButton: { show: true, position: 'left' }
    }"
    [footerSettings]="{ show: false }"
    [columns]="[ 
        { property: 'PART_NUMBER', alias: translatory.label.Material(), background: backgroundQTY, color: colorQTY },
        { property: 'QTY'        , alias: translatory.label.Qty(), background: backgroundQTY, color: colorQTY, format: 'number' },
        { property: 'QTY_CHECKED', alias: translatory.label.Scanned() , background: backgroundQTY, color: colorQTY, format: 'number' },
    ]"
    (onClickModalRow)="detail.set($event); modal.Open();">
    <div [innerHTML]="counter() | html" class="width-100 white-space-normal"></div>  
</wia-grid>


<!-- Detail -->
<wia-modal #modal [title]="detail()?.PART_NUMBER" icon="fa-solid fa-shapes" (onClose)="detail.set(null);">
    @if(IsNotNull(detail())) {
        <wia-grid
            [(ngModel)]="detail()!.DETAIL" 
            [isLoading]="isLoading()" 
            [useContainer]="false"
            marginTop="5px"
            marginLeft="0px"
            marginRight="0px"
            marginBottom="10px"
            minWidth="300px"
            width="300px"
            height="auto"
            [bodySettings]="{ 
                showBorders: true, 
                showRowNumber: true,
                deleteButton: { show: showDeleteButton(), displayProperty: 'LOT_NUMBER', preventDefault: true, position: 'left' }  
            }" 
            [footerSettings]="{ show: false }"
            [columns]="[ 
                { property: 'LOT_NUMBER', alias: translatory.label.Lot(), background: backgroundQTY, color: colorQTY }, 
                { property: 'QTY'       , alias: translatory.label.Qty(), width: '80px', background: backgroundQTY, color: colorQTY, format: 'number' }, 
            ]"
            (onClickDeleteRow)="RemoveLot($event)"> 
            <div [innerHTML]="counterDetail() | html" class="width-100 white-space-normal"></div>  
        </wia-grid>
    }
</wia-modal>
